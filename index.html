<script>
'use strict';
const $=id=>document.getElementById(id);
const defaults={count:240,speed:0.75,spread:1,cohesion:0.58,chaos:0.45,speedVar:0.5,wiggle:0.65,wiggleFreq:0.45,delay:0.9,breath:0.65,flow:0.7,touchStrength:1.65,touchRadius:0.36,size:1,zoom:1,grain:0.28,wind:0,preset:'v',gesture:'scatter',dark:false,skyMood:0,skyMode:'mood'};
let config={...defaults};try{let old=JSON.parse(localStorage.getItem('flocks-settings-v2')||'null');if(!old){const previous=JSON.parse(localStorage.getItem('flocks-settings-v1')||'null');if(previous)old=Object.fromEntries(['count','speed','size','zoom','grain','wind','preset','gesture','dark'].map(k=>[k,previous[k]]))}if(old)Object.keys(defaults).forEach(k=>{if(typeof old[k]===typeof defaults[k])config[k]=old[k]})}catch(e){}

if(!['v','flock','ribbon'].includes(config.preset))config.preset='v';if(!['scatter','guide','off'].includes(config.gesture))config.gesture='scatter';

  {ko:'평안',en:'Peace',colors:['#8CAACD','#C9CCE3','#F1DBCD']},
  {ko:'갈등',en:'Conflict',colors:['#233B72','#78628E','#E38C72']},
  {ko:'싱그러움',en:'Freshness',colors:['#429B89','#A4D4A7','#F0E8A3']},
  {ko:'설렘',en:'Flutter',colors:['#B498CC','#E8B4CE','#FFD7B4']},
  {ko:'희망',en:'Hope',colors:['#5AABD0','#BDE2DA','#FFF0B4']},
  {ko:'그리움',en:'Longing',colors:['#655F91','#AD96B0','#D9B7A5']},
  {ko:'열정',en:'Passion',colors:['#682F54','#CC5C67','#F5AC6E']},
  {ko:'고요',en:'Stillness',colors:['#172D48','#386477','#8CB6B5']},
  {ko:'위로',en:'Comfort',colors:['#8EAAA0','#D0D4B6','#F2DEC0']},
  {ko:'몽상',en:'Reverie',colors:['#504080','#9B8AC3','#E4C3DA']}

config.skyMood=Number.isInteger(config.skyMood)?((config.skyMood%SKY_MOODS.length)+SKY_MOODS.length)%SKY_MOODS.length:0;
if(!['mood','light','dark'].includes(config.skyMode))config.skyMode='mood';
function skyTarget(){return config.skyMode==='light'?SKY_LIGHT:config.skyMode==='dark'?SKY_DARK:SKY_MOODS[config.skyMood].rgb;}
const skyReducedMotion=matchMedia('(prefers-reduced-motion: reduce)');

let W=innerWidth,H=innerHeight,aspect=W/H,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,time=0,birds=[],groups=[],last=0,contextLost=false,accumulator=0;
const pointer={x:0,y:0,vx:0,vy:0,active:false,at:0},touches=new Map();let pinchDistance=0,pinchZoom=1,touchFields=[];

function sync(){for(const k of ranges){$(k).value=config[k];let out=k==='count'?config[k]+' 마리':k==='delay'?config[k].toFixed(2)+' s':k==='wiggleFreq'?config[k].toFixed(2)+' Hz':['speed','size','zoom','touchStrength'].includes(k)?config[k].toFixed(2)+'×':Math.round(config[k]*100)+'%';$(k+'-out').textContent=out}document.querySelectorAll('[data-preset]').forEach(b=>{b.classList.toggle('active',b.dataset.preset===config.preset);b.setAttribute('aria-pressed',b.dataset.preset===config.preset)});$('gesture').value=config.gesture;const top=skyTarget()[0];config.dark=(top[0]*.2126+top[1]*.7152+top[2]*.0722)<.52;document.body.classList.toggle('dark',config.dark);for(const id of ['light','dark']){$(id).classList.toggle('active',config.skyMode===id);$(id).setAttribute('aria-pressed',config.skyMode===id)}$('skyCycle').textContent=SKY_MOODS[config.skyMood].ko;$('skyCycle').style.setProperty('--sky-swatch','linear-gradient(180deg,'+SKY_MOODS[config.skyMood].colors.join(',')+')');$('skyCycle').setAttribute('aria-pressed',String(config.skyMode==='mood'));$('pause').textContent=paused?'재생':'일시정지'}

function rand(a,b){return a+Math.random()*(b-a)}
// Motion references: Reynolds' local steering rules, the Three.js GPGPU birds
// example, Adobe's seeded wiggle / valueAtTime delay, and CONNECTIONS' flow field.
// This is an artistic migration model, not a biological flight reconstruction.
const HISTORY=256,STEP=1/60;let historyHead=0,nextVelocity=new Float32Array(0);

function mix(a,b,t){return a+(b-a)*t}

// Each passing flock has its own proportions and flight rhythm.
// Profiles change only after the entire flock has left the screen.
function varyGroup(g){

    stretch:rand(.65,1.6),opening:rand(.42,1.5),tilt:rand(-.55,.55),bend:rand(-.65,.65),

function togglePause(){paused=!paused;sync()}$('pause').onclick=togglePause;$('enter').onclick=()=>{resetBirds(true);paused=false;sync();toast('오른쪽 바깥에서 다시 날아옵니다')};$('reset').onclick=()=>{config={...defaults};paused=false;resetBirds();sync();save()};$('close').onclick=()=>panel(false);$('toggle').onclick=()=>{document.body.classList.remove('clean');panel(document.body.classList.contains('panel-hidden'))};$('view').onclick=()=>{panel(false);document.body.classList.add('clean');toast('화면을 두 번 누르면 조작 패널이 열립니다')};canvas.addEventListener('dblclick',()=>{document.body.classList.remove('clean');panel(true)});
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else{panel(false);document.body.classList.add('clean');toast('이 기기에서는 영상만 보기로 전환합니다')}}catch(e){toast('전체화면을 지원하지 않는 브라우저입니다')}}$('fullscreen').onclick=fullscreen;
function point(e){const r=canvas.getBoundingClientRect();return{x:((e.clientX-r.left)/W-.5)*aspect/config.zoom,y:(.5-(e.clientY-r.top)/H)/config.zoom}}
function showTouchFeedback(e){if(config.gesture==='off')return;const el=$('touch-feedback'),diameter=Math.min(W,H)*config.touchRadius*.75;el.style.left=e.clientX+'px';el.style.top=e.clientY+'px';el.style.width=diameter+'px';el.style.height=diameter+'px';if(showTouchFeedback.animation)showTouchFeedback.animation.cancel();showTouchFeedback.animation=el.animate?.([{transform:'translate(-50%,-50%) scale(.15)',opacity:.42},{transform:'translate(-50%,-50%) scale(1)',opacity:0}],{duration:800,easing:'ease-out'})}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size>=2){const a=[...touches.values()];pinchDistance=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);pinchZoom=config.zoom;pointer.active=false;pointer.vx=0;pointer.vy=0;touchFields=[];for(const b of birds)b.react=0}else{Object.assign(pointer,point(e));pointer.vx=0;pointer.vy=0;pointer.at=performance.now();pointer.active=true;touchImpulse();showTouchFeedback(e)}});
canvas.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size>=2){const a=[...touches.values()];config.zoom=Math.max(.4,Math.min(2.5,pinchZoom*Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)/Math.max(pinchDistance,1)));sync();pointer.active=false}else movePointer(e)});
function pointerEnd(e){touches.delete(e.pointerId);pointer.active=false;if(touches.size===0)save()}
canvas.addEventListener('pointerup',pointerEnd);canvas.addEventListener('pointercancel',()=>clearInteraction());canvas.addEventListener('lostpointercapture',pointerEnd);canvas.addEventListener('wheel',e=>{e.preventDefault();config.zoom=Math.max(.4,Math.min(2.5,config.zoom*Math.exp(-e.deltaY*.001)));sync();save()},{passive:false});window.addEventListener('blur',clearInteraction);document.addEventListener('visibilitychange',()=>{last=performance.now();clearInteraction()});document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();togglePause()}if(e.key.toLowerCase()==='h'){document.body.classList.remove('clean');panel(document.body.classList.contains('panel-hidden'))}if(e.key.toLowerCase()==='f')fullscreen();if(e.key==='Escape'){document.body.classList.remove('clean');panel(true)}});
addEventListener('resize',resize);new ResizeObserver(resize).observe(canvas);canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();contextLost=true;toast('화면 복구 중입니다')});canvas.addEventListener('webglcontextrestored',()=>{try{initGL();resize();contextLost=false}catch(e){showError()}});function showError(){const el=$('error');el.style.display='grid';el.textContent='이 브라우저에서 하늘 화면을 열 수 없습니다. 최신 Safari 또는 Chrome에서 다시 열어 주세요.'}
sync();if(innerWidth<=600)panel(false);const params=new URLSearchParams(location.search);if(params.get('panel')==='0'){panel(false);document.body.classList.add('clean')}if(params.get('theme')==='dark'){config.skyMode='dark';liveSky=skyTarget().map(c=>c.slice());sync()}if(params.get('paused')==='1'){paused=true;sync()}
if(!gl)showError();else try{initGL();resize();resetBirds();requestAnimationFrame(frame)}catch(e){showError();console.error(e)}
